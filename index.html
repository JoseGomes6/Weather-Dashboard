<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Weather Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="header-logo" style="margin: 0">
          <h1 style="font-size: 1.1rem">Nexus<span>Settings</span></h1>
        </div>
        <button id="closeMenu" class="sidebar-close-btn">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="sidebar-content">
        <div class="settings-group">
          <label><i data-lucide="languages"></i> Idioma / Language</label>
          <select id="langSelect" class="sidebar-select">
            <option value="pt">Português</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="settings-group">
          <label><i data-lucide="thermometer"></i> Unidade de Medida</label>
          <select id="unitSelect" class="sidebar-select">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
          </select>
        </div>

        <div class="settings-group" style="margin-top: auto">
          <button id="btnExport" class="sidebar-btn">
            <i data-lucide="download"></i> Exportar Dados (.csv)
          </button>
        </div>
      </div>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <header class="main-header">
      <div class="header-container">
        <div class="header-logo">
          <button id="menuToggle" class="burger-btn">
            <i data-lucide="menu"></i>
          </button>
          <h1>Nexus<span>Weather</span></h1>
        </div>

        <nav class="search-wrapper">
          <div class="search-bar">
            <i data-lucide="search"></i>
            <input
              type="text"
              id="cityInput"
              placeholder="Pesquisar cidade..."
            />
            <button id="btnLocation" title="Minha Localização" class="icon-btn">
              <i data-lucide="map-pin"></i>
            </button>
          </div>
        </nav>

        <div class="header-actions">
          <div class="theme-controller">
            <i data-lucide="sun" class="icon-sun"></i>
            <label class="theme-switch">
              <input type="checkbox" id="theme-toggle" />
              <span class="slider"></span>
            </label>
            <i data-lucide="moon" class="icon-moon"></i>
          </div>
        </div>
      </div>
    </header>

    <main class="dashboard-container">
      <div class="dashboard-row hero-row">
        <article class="current-weather-card" id="currentWeather">
          <div class="video-bg">
            <video id="weatherVideo" autoplay muted loop playsinline></video>
            <div class="overlay"></div>
          </div>
          <div class="weather-content">
            <div class="skeleton-loader"></div>
          </div>
        </article>

        <aside class="analysis-panel">
          <div class="panel-header">
            <i data-lucide="calendar-days"></i>
            <h2 id="labelForecast">Previsão Semanal</h2>
          </div>
          <div class="forecast-scroller" id="forecast"></div>

          <div class="chart-section">
            <div class="panel-header">
              <i data-lucide="bar-chart-3"></i>
              <h2 id="labelRain">Precipitação</h2>
            </div>
            <div class="canvas-container">
              <canvas id="rainChart"></canvas>
            </div>
          </div>
        </aside>
      </div>

      <div class="dashboard-row bottom-row">
        <section class="map-card">
          <div class="panel-header">
            <i data-lucide="map"></i>
            <h2 id="labelMap">Radar Meteorológico</h2>
          </div>
          <div id="map"></div>
        </section>

        <section class="locations-card">
          <div class="panel-header">
            <i data-lucide="globe"></i>
            <h2 id="labelExplore">Explorar Mundo</h2>
          </div>
          <div class="cities-list" id="sampleCities"></div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
